<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#DC2626"/></marker></defs>
<rect width="1000" height="470" fill="#FFFFFF"/>
<rect x="20" y="20" width="470" height="430" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<path d="M20,32 a12,12 0 0 1 12,-12 h446 a12,12 0 0 1 12,12 v44 h-470 z" fill="#1E293B"/>
<rect x="36" y="34" width="56" height="26" rx="13" fill="#7C3AED"/>
<text x="64" y="51.4" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Task 1</text>
<text x="106" y="53.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">expense_tracker.py</text>
<text x="40" y="101.1" font-size="14.5" fill="#334155" font-weight="600" text-anchor="start">File handling · exceptions · sets</text>
<rect x="40" y="118" width="62" height="22" rx="5" fill="#2563EB"/>
<text x="71" y="132.8" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">INPUT</text>
<text x="116" y="133.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">Menu choice 1–4, then date, item,</text>
<text x="116" y="153.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">category and amount</text>
<rect x="40" y="188" width="62" height="22" rx="5" fill="#7C3AED"/>
<text x="71" y="202.8" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">RULES</text>
<text x="116" y="203.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• Amount must be a positive number</text>
<text x="116" y="223.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">   (ValueError → ask again)</text>
<text x="116" y="243.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• Missing CSV → FileNotFoundError</text>
<text x="116" y="263.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">   → start with an empty list</text>
<text x="116" y="283.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• Each new expense is saved to the CSV</text>
<rect x="40" y="318" width="62" height="22" rx="5" fill="#16A34A"/>
<text x="71" y="332.9" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">OUTPUT</text>
<text x="116" y="333.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">Expense table, unique categories (set)</text>
<text x="116" y="353.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">and totals per category</text>
<text x="40" y="401.9" font-size="11" fill="#64748B" font-weight="700" text-anchor="start">CONCEPTS</text>
<rect x="40" y="408" width="36" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="58.1" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">csv</text>
<rect x="84.2" y="408" width="103" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="135.60000000000002" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">try / except</text>
<rect x="195.0" y="408" width="36" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="213.1" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">set</text>
<rect x="239.2" y="408" width="110" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="294.3" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">comprehension</text>
<rect x="510" y="20" width="470" height="430" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<path d="M510,32 a12,12 0 0 1 12,-12 h446 a12,12 0 0 1 12,12 v44 h-470 z" fill="#1E293B"/>
<rect x="526" y="34" width="56" height="26" rx="13" fill="#7C3AED"/>
<text x="554" y="51.4" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Task 2</text>
<text x="596" y="53.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">attendance_cleaner.py</text>
<text x="530" y="101.1" font-size="14.5" fill="#334155" font-weight="600" text-anchor="start">Sets · list comprehensions</text>
<rect x="530" y="118" width="62" height="22" rx="5" fill="#2563EB"/>
<text x="561" y="132.8" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">INPUT</text>
<text x="606" y="133.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">attendance.txt (one student name</text>
<text x="606" y="153.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">per line)</text>
<rect x="530" y="188" width="62" height="22" rx="5" fill="#7C3AED"/>
<text x="561" y="202.8" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">RULES</text>
<text x="606" y="203.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• strip() + title() in a list comprehension</text>
<text x="606" y="223.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• set() removes duplicate students</text>
<text x="606" y="243.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• sorted() gives A–Z order</text>
<text x="606" y="263.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">• Missing / empty file is handled</text>
<rect x="530" y="318" width="62" height="22" rx="5" fill="#16A34A"/>
<text x="561" y="332.9" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">OUTPUT</text>
<text x="606" y="333.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">attendance_clean.csv, record counts</text>
<text x="606" y="353.6" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">and the cleaned attendance list</text>
<text x="530" y="401.9" font-size="11" fill="#64748B" font-weight="700" text-anchor="start">CONCEPTS</text>
<rect x="530" y="408" width="36" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="548.1" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">csv</text>
<rect x="574.2" y="408" width="36" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="592.3000000000001" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">set</text>
<rect x="618.4000000000001" y="408" width="147" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="692.0000000000001" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">list comprehension</text>
<rect x="773.6000000000001" y="408" width="73" height="26" rx="13" fill="#EEF2FF" stroke="#6366F1"/>
<text x="810.2000000000002" y="425.4" font-size="12.5" fill="#3730A3" font-weight="600" text-anchor="middle">sorted()</text>
</svg>
